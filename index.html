<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prem Rawat Portal</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        header { text-align: center; padding: 40px 20px; background: var(--primary); color: white; border-radius: 12px; margin-bottom: 30px; }
        .area-container { margin-bottom: 50px; }
        .area-title { border-bottom: 3px solid var(--accent); display: inline-block; margin-bottom: 25px; padding-bottom: 5px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .theme-tag { color: var(--accent); font-weight: bold; text-transform: uppercase; font-size: 0.8em; }
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; margin: 15px 0; background: #000; border-radius: 8px; overflow: hidden; }
        .video-box div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .status { font-size: 0.85em; color: #666; font-style: italic; }
        @media (max-width: 480px) { .video-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>Prem Rawat Themes</h1>
    <p>Peace Education Presentation Portal</p>
</header>

<div id="portal-content">
    <p style="text-align: center;">Initializing portal and scanning video sources...</p>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let videoData = [];

    // This triggers automatically once the YouTube API is ready
    async function onYouTubeIframeAPIReady() {
        try {
            const response = await fetch('./data.json');
            videoData = await response.json();
            renderGrid();
        } catch (e) {
            document.getElementById('portal-content').innerHTML = "Error: Could not load data.json. Ensure it is in your GitHub repo.";
        }
    }

    function renderGrid() {
        const container = document.getElementById('portal-content');
        container.innerHTML = '';

        videoData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="theme-tag">${item.area}</span>
                <h3 style="margin: 10px 0;">${item.theme}</h3>
                <div class="video-box" id="wrapper-${index}">
                    <div id="player-${index}"></div>
                </div>
                <div class="status" id="status-${index}">Verifying source...</div>
            `;
            container.appendChild(card);
            loadBestVideo(index, item.queue, 0);
        });
    }

    function loadBestVideo(cardIdx, queue, queueIdx) {
        const statusLabel = document.getElementById(`status-${cardIdx}`);
        
        new YT.Player(`player-${cardIdx}`, {
            videoId: queue[queueIdx],
            playerVars: { 'modestbranding': 1, 'rel': 0 },
            events: {
                'onReady': () => {
                    statusLabel.innerHTML = "✓ Video active";
                    statusLabel.style.color = "green";
                },
                'onError': (e) => {
                    // If video is unavailable (101/150), try the next in queue
                    if (queueIdx + 1 < queue.length) {
                        statusLabel.innerHTML = "Restricted source... trying backup...";
                        e.target.destroy();
                        
                        const wrap = document.getElementById(`wrapper-${cardIdx}`);
                        const nextDiv = document.createElement('div');
                        nextDiv.id = `player-${cardIdx}`;
                        wrap.appendChild(nextDiv);
                        
                        loadBestVideo(cardIdx, queue, queueIdx + 1);
                    } else {
                        statusLabel.innerHTML = "✖ No embeddable version found.";
                        statusLabel.style.color = "red";
                    }
                }
            }
        });
    }
</script>

</body>
</html>
