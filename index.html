<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prem Rawat | Thematic Portal</title>
    <style>
        :root { --blue: #003366; --gold: #c5a059; --bg: #fdfdfd; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        header { background: var(--blue); color: white; padding: 40px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .area-title { color: var(--blue); border-left: 5px solid var(--gold); padding-left: 15px; margin: 40px 0 20px; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .info { padding: 20px; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; background: var(--blue); color: white; text-decoration: none; border-radius: 4px; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: var(--gold); }
    </style>
</head>
<body>
    <header>
        <h1>The Message of Peace</h1>
        <p>Thematic Insights from Prem Rawat</p>
    </header>
    <div class="container">
        
        <h2 class="area-title">Area 1: Inner Resources</h2>
        <div class="grid">
            <div class="card">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/P6mE4_yXn0o?rel=0&modestbranding=1&origin=https://github.com" allowfullscreen></iframe>
                </div>
                <div class="info">
                    <h3>Peace Within</h3>
                    <a href="https://www.youtube.com/watch?v=P6mE4_yXn0o" class="btn" target="_blank">Watch on YouTube</a>
                </div>
            </div>
            <div class="card">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/6iO48O27t6s?rel=0&modestbranding=1&origin=https://github.com" allowfullscreen></iframe>
                </div>
                <div class="info">
                    <h3>Self-Knowledge</h3>
                    <a href="https://www.youtube.com/watch?v=6iO48O27t6s" class="btn" target="_blank">Watch on YouTube</a>
                </div>
            </div>
        </div>

        <h2 class="area-title">Area 2: The Experience of Life</h2>
        <div class="grid">
            <div class="card">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/8I4E1iN1RkY?rel=0&modestbranding=1&origin=https://github.com" allowfullscreen></iframe>
                </div>
                <div class="info">
                    <h3>Clarity & Choice</h3>
                    <a href="https://www.youtube.com/watch?v=8I4E1iN1RkY" class="btn" target="_blank">Watch on YouTube</a>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
