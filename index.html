<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Message of Peace | Prem Rawat 2026</title>
    <style>
        :root { --blue: #1a3a5f; --gold: #c5a059; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        header { background: var(--blue); color: white; padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--gold); }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .area-section { margin-bottom: 50px; }
        .area-title { color: var(--blue); border-left: 6px solid var(--gold); padding-left: 15px; margin-bottom: 25px; text-transform: uppercase; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .info { padding: 20px; text-align: center; }
        .btn { display: inline-block; padding: 10px 20px; background: var(--blue); color: white; text-decoration: none; border-radius: 4px; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>The Message of Peace</h1>
        <p>Verified Thematic Portal | Prem Rawat</p>
    </header>

    <div class="container">
        
        <section class="area-section">
            <h2 class="area-title">Area 1: Inner Resources</h2>
            <div class="grid">
                <div class="card">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/P6mE4_yXn0o" allowfullscreen></iframe>
                    </div>
                    <div class="info">
                        <h3>Understanding Peace</h3>
                        <a href="https://www.youtube.com/watch?v=P6mE4_yXn0o" class="btn" target="_blank">Watch on YouTube</a>
                    </div>
                </div>

                <div class="card">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/S_8XmXN2Ntc" allowfullscreen></iframe>
                    </div>
                    <div class="info">
                        <h3>The Discovery of Self</h3>
                        <a href="https://www.youtube.com/watch?v=S_8XmXN2Ntc" class="btn" target="_blank">Watch on YouTube</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="area-section">
            <h2 class="area-title">Area 2: Global Impact</h2>
            <div class="grid">
                <div class="card">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ZeYOAO4mtE4" allowfullscreen></iframe>
                    </div>
                    <div class="info">
                        <h3>Peace Education Program</h3>
                        <a href="https://tprf.org" class="btn" target="_blank">TPRF Initiatives</a>
                    </div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
